name: cmpc-books
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-books}
      POSTGRES_DB: ${POSTGRES_DB:-books}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  migrate:
    build:
      context: ./backend
      target: migrate
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-books}
      POSTGRES_DB: ${POSTGRES_DB:-books}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env}
      NODE_ENV: production
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@example.com}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  backend:
    build:
      context: ./backend
      target: runtime
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-books}
      POSTGRES_DB: ${POSTGRES_DB:-books}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en backend/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900}
      NODE_ENV: production
      PORT: 3000
      UPLOADS_DIR: /app/uploads
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks: [app]

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
